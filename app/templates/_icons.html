{% macro icon(name, size=18) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
  focusable="false">
  {%- if name == 'home' -%}
  <path d="M4 11 12 4l8 7" /><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" /><path d="M10 20v-6h4v6" />
  {%- elif name == 'shield' -%}
  <path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z" />
  {%- elif name == 'log-out' -%}
  <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" /><polyline points="14 15 19 12 14 9" /><line x1="19" y1="12"
    x2="9" y2="12" />
  {%- elif name == 'upload' -%}
  <path d="M12 4v11" /><polyline points="7 8 12 4 17 8" /><path d="M5 19h14" />
  {%- elif name == 'download' -%}
  <path d="M12 4v11" /><polyline points="7 11 12 16 17 11" /><path d="M5 19h14" />
  {%- elif name == 'users' -%}
  <circle cx="9" cy="8" r="3" /><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" /><circle cx="17" cy="9" r="2.5" /><path
    d="M15 20c.3-2.4 1.8-4.3 4-5" />
  {%- elif name == 'bar-chart' -%}
  <line x1="5" y1="20" x2="5" y2="12" /><line x1="12" y1="20" x2="12" y2="6" /><line x1="19" y1="20" x2="19" y2="15" />
  {%- elif name == 'arrow-left' -%}
  <line x1="19" y1="12" x2="5" y2="12" /><polyline points="11 6 5 12 11 18" />
  {%- elif name == 'refresh' -%}
  <path d="M4 12a8 8 0 0 1 14.5-4.5" /><path d="M20 12a8 8 0 0 1-14.5 4.5" /><polyline points="18.5 3 18.5 7.5 14 7.5" />
  <polyline points="5.5 21 5.5 16.5 10 16.5" />
  {%- elif name == 'edit' -%}
  <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" />
  {%- elif name == 'trash' -%}
  <path d="M5 7h14" /><path d="M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2" /><path d="M7 7l1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12" />
  {%- elif name == 'search' -%}
  <circle cx="10" cy="10" r="6" /><line x1="20" y1="20" x2="14.5" y2="14.5" />
  {%- elif name == 'mail' -%}
  <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" />
  {%- elif name == 'chevron-left' -%}
  <polyline points="15 6 9 12 15 18" />
  {%- elif name == 'chevron-right' -%}
  <polyline points="9 6 15 12 9 18" />
  {%- elif name == 'external-link' -%}
  <path d="M14 5h5v5" /><line x1="19" y1="5" x2="10" y2="14" /><path d="M8 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2" />
  {%- elif name == 'alert-triangle' -%}
  <path d="M12 4 21 20H3Z" /><line x1="12" y1="10" x2="12" y2="14.5" /><line x1="12" y1="16.7" x2="12" y2="17" />
  {%- elif name == 'check-circle' -%}
  <circle cx="12" cy="12" r="9" /><polyline points="8 12 11 15 16 9" />
  {%- elif name == 'file' -%}
  <path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" /><polyline points="14 3 14 8 19 8" />
  {%- elif name == 'inbox' -%}
  <path d="M4 12h4l2 3h4l2-3h4" /><path d="M5 12 3 5h18l-2 7" /><path d="M4 12v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6" />
  {%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="3" x2="8" y2="7" />
  <line x1="16" y1="3" x2="16" y2="7" />
  {%- elif name == 'send' -%}
  <path d="M4 12 20 4 13 20l-2-7-7-1Z" />
  {%- endif -%}
</svg>
{%- endmacro %}
