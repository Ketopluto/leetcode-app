{% extends "_base.html" %}
{% block title %}Sign in · LeetCode Stats{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="card login-card rise">
    <div class="login-mark">{{ ui.icon('shield', 19) }}</div>
    <h1 class="page-title" style="font-size:20px">Admin access</h1>
    <p class="page-subtitle" style="margin-bottom:22px">Restricted to the Head of Department.</p>

    <form method="POST" action="{{ url_for('admin_login') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required autofocus
          autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
